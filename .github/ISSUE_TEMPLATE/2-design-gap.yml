name: Design gap
description: Rite works as designed, but the model has no answer for a real case.
labels: [design-gap]
body:
  - type: markdown
    attributes:
      value: |
        Use this when following rite's rules leads to a dead end: a rule that cannot be satisfied,
        a situation no item type or command covers, or an instruction that contradicts another.

  - type: input
    id: version
    attributes:
      label: Rite version
      placeholder: "0.27.1"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - "cli — bin/, rite_lib/"
        - "commands — commands/, parts/"
        - "agents — agents/"
        - "hooks — hooks/"
        - "config — rite.toml, docs/CONFIG.md"
        - "templates — templates/, examples/"
        - "Not sure"
    validations:
      required: true

  - type: dropdown
    id: origin
    attributes:
      label: Origin
      options:
        - Found running rite on another repository
        - Found reading rite's own code or docs
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which rule or command falls short, and why it cannot be followed. Quote it.
    validations:
      required: true

  - type: textarea
    id: observed
    attributes:
      label: Observed
      description: Repository, cycle and item IDs where it happened, and how it was worked around.
      placeholder: |
        Observed in cycle `base-scraper` (rite 0.16.2):
        - FIX-BASE-011: ...
    validations:
      required: true

  - type: textarea
    id: options
    attributes:
      label: Options
      description: Possible changes to the model, with their trade-offs.
