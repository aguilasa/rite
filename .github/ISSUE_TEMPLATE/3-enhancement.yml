name: Enhancement
description: Something rite does not do yet and should — a new command, check, option or output.
labels: [enhancement]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - "cli — bin/, rite_lib/"
        - "commands — commands/, parts/"
        - "agents — agents/"
        - "hooks — hooks/"
        - "config — rite.toml, docs/CONFIG.md"
        - "templates — templates/, examples/"
        - "Not sure"
    validations:
      required: true

  - type: dropdown
    id: origin
    attributes:
      label: Origin
      options:
        - Found running rite on another repository
        - Found reading rite's own code or docs
        - Idea, not from a concrete case
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: The concrete case that needs it. What went wrong or took manual work without it.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What rite should do. Command syntax, config keys or output shape, if you have them.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds in use today, or other designs considered.
