[project]
name = "slugkit"

[guards]
read_only = ["fixtures/golden/**"]
read_only_reason = "golden files are reference data; tests compare against them"

[[guards.generated]]
paths = ["src/index.mjs"]
generator = "tools/gen-exports.mjs"
check = "node tools/gen-exports.mjs --check"

[gates]
global = ["npm test", "node tools/gen-exports.mjs --check"]
