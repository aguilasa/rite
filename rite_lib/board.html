<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rite board</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<script src="https://cdn.jsdelivr.net/npm/vue@3.4.38/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
  [v-cloak] { display: none; }
  tr.item-row { cursor: pointer; }
  .filter-label { min-width: 6.5rem; }
  tr.flash > * { animation: flash 2s ease-out; }
  @keyframes flash { from { background-color: var(--bs-warning-bg-subtle); } to { background-color: transparent; } }
  .markdown h1 { font-size: 1.6rem; } .markdown h2 { font-size: 1.3rem; margin-top: 1.5rem; } .markdown h3 { font-size: 1.1rem; }
  .markdown pre { padding: .75rem; background: var(--bs-tertiary-bg); border-radius: .375rem; }
  .markdown table { margin-bottom: 1rem; }
  .markdown table td, .markdown table th { border: 1px solid var(--bs-border-color); padding: .25rem .5rem; }
  .markdown blockquote { padding-left: 1rem; border-left: .25rem solid var(--bs-border-color); color: var(--bs-secondary-color); }
</style>
</head>
<body>
<div id="offline" style="padding: 1rem; font-family: sans-serif;">
  This page loads Vue, Bootstrap, marked and DOMPurify from cdn.jsdelivr.net and could not reach it.
  The data is still served as JSON under <code>/api/cycles</code>.
</div>

<div id="app" v-cloak>
  <nav class="navbar border-bottom mb-3">
    <div class="container-fluid">
      <a class="navbar-brand" href="#/">Rite board</a>
      <span class="badge" :class="conn === 'live' ? 'text-bg-success' : 'text-bg-secondary'">{{ conn }}</span>
    </div>
  </nav>

  <main class="container-fluid pb-4">
    <div v-if="error" class="alert alert-warning">
      {{ error }} <a href="#/" class="alert-link">Back to the cycles</a>
    </div>

    <!-- the cycles -->
    <template v-else-if="route.view === 'list' && cycles">
      <section v-for="group in [['Open', cycles.open], ['Closed', cycles.closed]]" :key="group[0]" class="mb-4">
        <h2 class="h5">{{ group[0] }} <span class="badge text-bg-secondary">{{ group[1].length }}</span></h2>
        <p v-if="!group[1].length" class="text-secondary">No {{ group[0].toLowerCase() }} cycle.</p>
        <div class="list-group">
          <a v-for="c in group[1]" :key="c.folder" :href="cycleHref(c.folder)"
             class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
            <span>
              <span v-if="c.seq" class="text-secondary">#{{ c.seq }} </span>
              <strong>{{ c.name }}</strong>
              <span v-if="c.prefix" class="text-secondary"> [{{ c.prefix }}]</span>
              <small class="d-block text-secondary">{{ c.folder }}</small>
              <small v-if="c.error" class="d-block text-danger">{{ c.error }}</small>
            </span>
            <span v-if="c.tasks">
              <span class="badge text-bg-success me-1">{{ c.tasks.done }}/{{ c.tasks.total }} done</span>
              <span v-if="c.tasks['in-progress']" class="badge text-bg-primary me-1">{{ c.tasks['in-progress'] }} in progress</span>
              <span v-if="c.tasks.blocked" class="badge text-bg-danger me-1">{{ c.tasks.blocked }} blocked</span>
              <span class="badge" :class="c.open_fixes ? 'text-bg-warning' : 'text-bg-light'">{{ c.open_fixes }} open fixes</span>
            </span>
          </a>
        </div>
      </section>
    </template>

    <!-- one cycle -->
    <template v-else-if="route.view === 'cycle' && cycle">
      <h1 class="h4">
        {{ cycle.name }} <span v-if="cycle.prefix" class="text-secondary">[{{ cycle.prefix }}]</span>
        <span v-if="cycle.archived" class="badge text-bg-secondary align-middle">closed</span>
      </h1>
      <p class="text-secondary"><small>{{ cycle.folder }}</small></p>
      <ul class="nav nav-tabs mb-3">
        <li class="nav-item" v-for="tab in ['tasks', 'fixes']" :key="tab">
          <a class="nav-link" :class="{ active: route.tab === tab }" :href="cycleHref(cycle.folder, tab, true)">
            {{ tab === 'tasks' ? 'Tasks' : 'Fixes' }}
            <span class="badge text-bg-secondary">{{ activeCount(tab) ? filtered(tab).length + '/' : '' }}{{ cycle[tab].length }}</span></a>
        </li>
      </ul>

      <!-- filters of the active tab: OR within a field, AND across fields -->
      <div class="d-flex align-items-center gap-2 mb-2" data-filters>
        <button type="button" class="btn btn-sm btn-outline-secondary" @click="showFilters[route.tab] = !showFilters[route.tab]">
          Filters <span v-if="activeCount(route.tab)" class="badge text-bg-primary">{{ activeCount(route.tab) }}</span>
        </button>
        <button v-if="activeCount(route.tab)" type="button" class="btn btn-sm btn-link" @click="clearFilters(route.tab)">Clear</button>
        <small class="text-secondary ms-auto">showing {{ rows.length }} of {{ cycle[route.tab].length }}</small>
      </div>
      <div v-if="showFilters[route.tab]" class="card card-body py-2 mb-3">
        <div v-for="f in FIELDS[route.tab]" :key="f.key" class="d-flex flex-wrap align-items-center gap-1 my-1">
          <span class="small fw-semibold filter-label">{{ f.label }}</span>
          <template v-if="f.kind === 'set'">
            <button v-for="o in facets[f.key]" :key="o.value" type="button" class="btn btn-sm py-0"
                    :class="current[f.key].includes(o.value) ? 'btn-primary' : 'btn-outline-secondary'"
                    @click="toggle(f.key, o.value)">
              {{ o.value === '' ? '—' : o.value }} <span class="badge rounded-pill text-bg-light ms-1">{{ o.count }}</span>
            </button>
          </template>
          <template v-else>
            <select class="form-select form-select-sm w-auto" v-model="current[f.key].has">
              <option v-for="h in f.has" :key="h" :value="h">{{ HAS_LABEL[h] }}</option>
            </select>
            <input type="date" class="form-control form-control-sm w-auto" v-model="current[f.key].from" :aria-label="f.label + ' from'">
            <span class="text-secondary">–</span>
            <input type="date" class="form-control form-control-sm w-auto" v-model="current[f.key].to" :aria-label="f.label + ' to'">
          </template>
        </div>
      </div>

      <div class="table-responsive" v-if="route.tab === 'tasks'">
        <table class="table table-sm table-hover align-middle">
          <thead><tr><th>ID</th><th>Title</th><th>Phase</th><th>Type</th><th>Depends on</th><th>Status</th><th>Done on</th><th>Review</th><th>Reviewed on</th></tr></thead>
          <tbody>
            <tr v-for="t in rows" :key="t.id" class="item-row" :class="{ flash: flashing.has(t.id) }" @click="openItem(t.id)">
              <td class="text-nowrap"><a :href="itemHref(t.id)" target="_blank" rel="noopener" @click.stop>{{ t.id }}</a></td>
              <td>{{ cell(t.title) }}</td>
              <td>{{ cell(t.phase) }}</td>
              <td>{{ cell(t.type) }}</td>
              <td>{{ cell(t.depends_on) }}</td>
              <td><span class="badge" :class="statusClass(t.status)">{{ cell(t.status) }}</span></td>
              <td class="text-nowrap">{{ cell(t.done_on) }}</td>
              <td><span class="badge" :class="reviewClass(t.review)">{{ cell(t.review) }}</span></td>
              <td class="text-nowrap">{{ cell(t.reviewed_on) }}</td>
            </tr>
            <tr v-if="!rows.length"><td>—</td><td colspan="8"><em>{{ cycle.tasks.length ? '(no task matches the filters)' : '(no tasks yet)' }}</em></td></tr>
          </tbody>
        </table>
      </div>

      <div class="table-responsive" v-else>
        <table class="table table-sm table-hover align-middle">
          <thead><tr><th>ID</th><th>Title</th><th>Origin</th><th>Severity</th><th>Status</th><th>Done on</th></tr></thead>
          <tbody>
            <tr v-for="f in rows" :key="f.id" class="item-row" :class="{ flash: flashing.has(f.id) }" @click="openItem(f.id)">
              <td class="text-nowrap"><a :href="itemHref(f.id)" target="_blank" rel="noopener" @click.stop>{{ f.id }}</a></td>
              <td>{{ cell(f.title) }}</td>
              <td>{{ cell(f.origin) }}</td>
              <td><span class="badge" :class="severityClass(f.severity)">{{ cell(f.severity) }}</span></td>
              <td><span class="badge" :class="statusClass(f.status)">{{ cell(f.status) }}</span></td>
              <td class="text-nowrap">{{ cell(f.done_on) }}</td>
            </tr>
            <tr v-if="!rows.length"><td>—</td><td colspan="5"><em>{{ cycle.fixes.length ? '(no fix matches the filters)' : '(no fixes)' }}</em></td></tr>
          </tbody>
        </table>
      </div>
    </template>

    <!-- one item -->
    <template v-else-if="route.view === 'item' && item">
      <p class="mb-1"><a :href="cycleHref(item.folder, item.kind === 'fix' ? 'fixes' : 'tasks')">{{ item.cycle }}</a></p>
      <h1 class="h4">
        {{ item.id }} <span class="badge align-middle" :class="statusClass(item.status)">{{ cell(item.status) }}</span>
        <span v-if="item.severity" class="badge align-middle" :class="severityClass(item.severity)">{{ item.severity }}</span>
      </h1>
      <p class="text-secondary"><small>{{ item.path }}</small></p>
      <div v-if="item.error" class="alert alert-danger">{{ item.error }}</div>
      <article v-if="markdownHtml !== null" class="markdown" v-html="markdownHtml"></article>
      <pre v-else class="markdown">{{ item.markdown }}</pre>
    </template>

    <p v-else class="text-secondary">Loading…</p>
  </main>
</div>

<script>
(function () {
  // Bootstrap 5.3 themes itself from this attribute; follow the system setting.
  const dark = window.matchMedia('(prefers-color-scheme: dark)');
  const theme = () => document.documentElement.setAttribute('data-bs-theme', dark.matches ? 'dark' : 'light');
  theme();
  dark.addEventListener('change', theme);

  if (!window.Vue) return; // offline: the static notice stays
  document.getElementById('offline').remove();

  // #/  ·  #/cycle/<folder>?tab=tasks|fixes[&<field>=<filter>…]  ·  #/item/<folder>/<id>
  // folder and id are URI-encoded; the filters of the active tab follow the tab (see toQuery).
  // Every view has a tab ('tasks' outside a cycle): the filter state is indexed by it.
  function parseHash() {
    const [path, query] = location.hash.replace(/^#\/?/, '').split('?');
    const parts = path.split('/').filter(Boolean).map(decodeURIComponent);
    const params = new URLSearchParams(query || '');
    const tab = params.get('tab') === 'fixes' ? 'fixes' : 'tasks';
    if (parts[0] === 'cycle' && parts[1]) return { view: 'cycle', folder: parts[1], tab, params };
    if (parts[0] === 'item' && parts[1] && parts[2]) return { view: 'item', folder: parts[1], id: parts[2], tab };
    return { view: 'list', tab };
  }

  const STATUS = { done: 'text-bg-success', 'in-progress': 'text-bg-primary', blocked: 'text-bg-danger',
                   pending: 'text-bg-secondary', skipped: 'text-bg-light', stale: 'text-bg-light' };
  const SEVERITY = { critical: 'text-bg-danger', high: 'text-bg-warning', medium: 'text-bg-info', low: 'text-bg-secondary' };
  // a task's place in review, derived by the server (render_md.review_status)
  const REVIEW = { awaiting: 'text-bg-secondary', 'in review': 'text-bg-primary', changes: 'text-bg-warning',
                   approved: 'text-bg-success' };

  // --- filters -------------------------------------------------------------
  const STATUS_ORDER = ['pending', 'in-progress', 'blocked', 'done', 'skipped', 'stale'];
  const SEVERITY_ORDER = ['critical', 'high', 'medium', 'low'];
  const REVIEW_ORDER = ['awaiting', 'in review', 'changes', 'approved'];
  const FIELDS = {
    tasks: [{ key: 'phase', label: 'Phase', kind: 'set' }, { key: 'type', label: 'Type', kind: 'set' },
            { key: 'status', label: 'Status', kind: 'set', order: STATUS_ORDER },
            { key: 'done_on', label: 'Done on', kind: 'date', has: ['any', 'set', 'empty'] },
            // reviewed_on is a date, or "pending" while the task waits for its review
            { key: 'review', label: 'Review', kind: 'set', order: REVIEW_ORDER },
            { key: 'reviewed_on', label: 'Reviewed on', kind: 'date', has: ['any', 'set', 'pending', 'empty'] }],
    fixes: [{ key: 'severity', label: 'Severity', kind: 'set', order: SEVERITY_ORDER },
            { key: 'status', label: 'Status', kind: 'set', order: STATUS_ORDER },
            { key: 'done_on', label: 'Done on', kind: 'date', has: ['any', 'set', 'empty'] }],
  };
  const HAS_LABEL = { any: 'any', set: 'has a date', pending: 'pending review', empty: 'empty' };
  const DATE = /^\d{4}-\d{2}-\d{2}$/;
  const EMPTY_CHIP = '_'; // the chip of an empty value ('—') in the URL

  const value = (v) => (v === null || v === undefined ? '' : String(v));

  function emptyFilters(tab) {
    return Object.fromEntries(FIELDS[tab].map(f => [f.key, f.kind === 'set' ? [] : { has: 'any', from: '', to: '' }]));
  }
  function isActive(f, sel) { return f.kind === 'set' ? sel.length > 0 : sel.has !== 'any' || !!sel.from || !!sel.to; }

  function matches(row, tab, filters) {
    return FIELDS[tab].every((f) => {
      const sel = filters[f.key];
      const v = value(row[f.key]);
      if (f.kind === 'set') return !sel.length || sel.includes(v);
      if (sel.has === 'set' && !DATE.test(v)) return false;
      if (sel.has === 'empty' && v) return false;
      if (sel.has === 'pending' && v !== 'pending') return false;
      if ((sel.from || sel.to) && !(DATE.test(v) && (!sel.from || v >= sel.from) && (!sel.to || v <= sel.to))) return false;
      return true;
    });
  }

  // chips in a stable order: the lifecycle / severity order, phases by number, the rest by name; '—' last
  function sortValues(values, order) {
    const rank = (v) => (v === '' ? [2, 0, ''] : order && order.includes(v) ? [0, order.indexOf(v), '']
      : !order && v !== '' && !isNaN(v) ? [0, Number(v), ''] : [1, 0, v]);
    return values.sort((a, b) => {
      const [x, y] = [rank(a), rank(b)];
      return x[0] - y[0] || x[1] - y[1] || x[2].localeCompare(y[2]);
    });
  }

  // field=a,b (set) · field=from..to | set | empty | pending (date) — only fields with a filter
  function toQuery(tab, filters) {
    const out = ['tab=' + tab];
    for (const f of FIELDS[tab]) {
      const sel = filters[f.key];
      if (!isActive(f, sel)) continue;
      const text = f.kind === 'set' ? sel.map(v => encodeURIComponent(v === '' ? EMPTY_CHIP : v)).join(',')
        : sel.from || sel.to ? sel.from + '..' + sel.to : sel.has;
      out.push(f.key + '=' + text);
    }
    return out.join('&');
  }
  function fromParams(tab, params) {
    const filters = emptyFilters(tab);
    for (const f of FIELDS[tab]) {
      const raw = params && params.get(f.key);
      if (!raw) continue;
      if (f.kind === 'set') {
        filters[f.key] = raw.split(',').filter(Boolean).map(v => (v === EMPTY_CHIP ? '' : v));
      } else if (raw.includes('..')) {
        const [from, to] = raw.split('..');
        Object.assign(filters[f.key], { from: DATE.test(from) ? from : '', to: DATE.test(to) ? to : '' });
      } else if (f.has.includes(raw)) {
        filters[f.key].has = raw;
      }
    }
    return filters;
  }

  Vue.createApp({
    data() {
      const route = parseHash();
      const filters = { tasks: emptyFilters('tasks'), fixes: emptyFilters('fixes') };
      const showFilters = { tasks: false, fixes: false };
      if (route.view === 'cycle') {
        filters[route.tab] = fromParams(route.tab, route.params);
        showFilters[route.tab] = FIELDS[route.tab].some(f => isActive(f, filters[route.tab][f.key]));
      }
      return { route, conn: 'connecting', error: '', cycles: null, cycle: null, item: null,
               flashing: new Set(), filters, showFilters, FIELDS, HAS_LABEL };
    },
    computed: {
      current() { return this.filters[this.route.tab]; },
      rows() { return this.cycle ? this.filtered(this.route.tab) : []; },
      // the values each field of the active tab takes, counted over all its rows — so a chip does not
      // vanish when filtered out; a selected value no row has any more stays, with 0
      facets() {
        const out = {};
        const all = this.cycle ? this.cycle[this.route.tab] : [];
        for (const f of FIELDS[this.route.tab].filter(f => f.kind === 'set')) {
          const counts = new Map(this.current[f.key].map(v => [v, 0]));
          for (const row of all) counts.set(value(row[f.key]), (counts.get(value(row[f.key])) || 0) + 1);
          out[f.key] = sortValues([...counts.keys()], f.order).map(v => ({ value: v, count: counts.get(v) }));
        }
        return out;
      },
      markdownHtml() {
        if (!this.item || !window.marked || !window.DOMPurify) return null;
        return DOMPurify.sanitize(marked.parse(this.item.markdown || ''));
      },
    },
    methods: {
      // the markdown views' rule: nothing → an em dash, a list → comma-separated
      cell(v) {
        if (v === null || v === undefined || v === '' || (Array.isArray(v) && !v.length)) return '—';
        return Array.isArray(v) ? v.join(', ') : String(v);
      },
      statusClass(s) { return STATUS[s] || 'text-bg-light'; },
      severityClass(s) { return SEVERITY[s] || 'text-bg-light'; },
      reviewClass(s) { return REVIEW[s] || 'text-bg-light'; },
      // withFilters: the link keeps that tab's filters (the tabs of the open cycle, the address bar)
      cycleHref(folder, tab, withFilters) {
        const query = withFilters ? toQuery(tab, this.filters[tab]) : tab ? 'tab=' + tab : '';
        return '#/cycle/' + encodeURIComponent(folder) + (query ? '?' + query : '');
      },
      filtered(tab) { return this.cycle[tab].filter(row => matches(row, tab, this.filters[tab])); },
      activeCount(tab) { return FIELDS[tab].filter(f => isActive(f, this.filters[tab][f.key])).length; },
      toggle(key, v) {
        const sel = this.current[key];
        const at = sel.indexOf(v);
        if (at === -1) sel.push(v); else sel.splice(at, 1);
      },
      clearFilters(tab) { this.filters[tab] = emptyFilters(tab); },
      // the address bar follows the filters without a history entry (and without a hashchange)
      writeHash() {
        if (this.route.view !== 'cycle') return;
        const hash = this.cycleHref(this.route.folder, this.route.tab, true);
        if (location.hash !== hash) history.replaceState(null, '', hash);
      },
      itemHref(id) { return '#/item/' + encodeURIComponent(this.route.folder) + '/' + encodeURIComponent(id); },
      openItem(id) { window.open(this.itemHref(id), '_blank', 'noopener'); },

      async fetchJson(url) {
        const res = await fetch(url, { cache: 'no-store' });
        if (res.status === 503) { setTimeout(() => this.load(), 500); return null; } // caught mid-write
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || res.statusText);
        return data;
      },
      async load() {
        const r = this.route;
        try {
          if (r.view === 'list') {
            const data = await this.fetchJson('/api/cycles');
            if (data) { this.cycles = data; this.error = ''; document.title = 'Rite board'; }
          } else if (r.view === 'cycle') {
            const data = await this.fetchJson('/api/cycle?folder=' + encodeURIComponent(r.folder));
            if (!data) return;
            this.flash(this.cycle && this.cycle.folder === data.folder ? this.cycle : null, data);
            this.cycle = data; this.error = '';
            document.title = data.name + ' — Rite board';
          } else {
            const data = await this.fetchJson('/api/item?folder=' + encodeURIComponent(r.folder)
                                              + '&id=' + encodeURIComponent(r.id));
            if (data) { this.item = data; this.error = ''; document.title = data.id + ' — ' + data.title; }
          }
        } catch (e) {
          this.error = r.view === 'list' ? e.message
            : e.message + ' — the cycle may have been closed (moved to the archive) or renamed.';
        }
      },
      // rows whose status changed since the last load blink for two seconds
      flash(before, after) {
        if (!before) return;
        const old = new Map([...before.tasks, ...before.fixes].map(i => [i.id, i.status]));
        const changed = [...after.tasks, ...after.fixes].filter(i => old.has(i.id) && old.get(i.id) !== i.status);
        if (!changed.length) return;
        this.flashing = new Set(changed.map(i => i.id));
        setTimeout(() => { this.flashing = new Set(); }, 2000);
      },
      listen() {
        const events = new EventSource('/api/events');
        events.onopen = () => {
          if (this.conn === 'reconnecting') this.load(); // events missed while away
          this.conn = 'live';
        };
        events.onerror = () => { this.conn = 'reconnecting'; };
        events.addEventListener('change', (e) => {
          const change = JSON.parse(e.data);
          const r = this.route;
          if (r.view === 'list' || change.cycles || change.folders.includes(r.folder)) this.load();
        });
      },
    },
    watch: {
      filters: { deep: true, handler() { this.writeHash(); } },
    },
    mounted() {
      window.addEventListener('hashchange', () => {
        const before = this.route;
        this.route = parseHash();
        const moved = this.route.view !== before.view || this.route.folder !== before.folder || this.route.id !== before.id;
        if (this.route.view === 'cycle') {
          if (moved) {
            this.filters = { tasks: emptyFilters('tasks'), fixes: emptyFilters('fixes') };
            this.showFilters = { tasks: false, fixes: false };
          }
          this.filters[this.route.tab] = fromParams(this.route.tab, this.route.params);
          if (this.activeCount(this.route.tab)) this.showFilters[this.route.tab] = true;
        }
        if (moved) {
          this.cycle = null; this.item = null; this.error = '';
          this.load();
        }
      });
      this.writeHash();
      this.load();
      this.listen();
    },
  }).mount('#app');
})();
</script>
</body>
</html>
